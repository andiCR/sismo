name: Build and deploy site

# Rebuilds on every push and every 10 minutes (GitHub often starts scheduled runs late, 20–40
# minutes apart). New quakes don't wait for that: the worker in worker/ checks every minute and
# starts this workflow (workflow_dispatch) as soon as a quake needs a share page.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v6
      # Fonts and USGS ShakeMaps for the share cards (scripts/build-site.mjs), kept between builds.
      - name: Restore build cache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-
      - name: Build site and share pages
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      # Saved only when something in it changed (a new or revised ShakeMap).
      - name: Save build cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache
          key: build-cache-${{ hashFiles('.cache/**') }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
