<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sismo · Live Earthquake Map</title>
  <meta name="description" content="Live earthquake map for Costa Rica and the world, with data from OVSICORI, RSN-UCR, EMSC and USGS.">
  <meta name="theme-color" content="#0a0e15">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="map" aria-label="Earthquake map"></div>

  <div id="left">
    <section id="controls" class="glass">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h4l2-6 3 13 3-10 2 6 1.5-3H22"/></svg>
        <span class="name">Sismo</span>
        <span id="live" class="live" data-status="connecting"><i></i><span>Connecting</span></span>
        <div class="seg tiny" id="langSeg" role="group" data-i18n-aria="lang.label">
          <button data-v="es" lang="es" title="Español">ES</button>
          <button data-v="en" lang="en" title="English">EN</button>
        </div>
        <button class="icon-btn" id="aboutBtn" data-i18n-title="about.title" data-i18n-aria="about.title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </button>
      </div>
      <div class="seg" id="sourceSeg" role="group" data-i18n-aria="source.label">
        <button data-v="EMSC">EMSC<span class="hide-sm"> + OVSICORI</span></button>
        <button data-v="USGS">USGS</button>
      </div>
      <div class="seg" id="periodSeg" role="group" data-i18n-aria="period.label">
        <button data-v="24h">24 h</button>
        <button data-v="7d" data-i18n="period.7d">7 days</button>
        <button data-v="30d" data-i18n="period.30d">30 days</button>
      </div>
      <div class="chips" id="regions" role="group" data-i18n-aria="regions.label">
        <button data-r="cr">Costa Rica</button>
        <button data-r="ca" data-i18n="region.ca">Central America</button>
        <button data-r="am" data-i18n="region.am">Americas</button>
        <button data-r="world" data-i18n="region.world">World</button>
        <button id="nearMe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span data-i18n="nearMe">Near me</span>
        </button>
      </div>
    </section>

    <section id="panel" class="glass" data-view="list">
      <header class="panel-head">
        <div id="summary" data-i18n="loading">Loading…</div>
        <button class="icon-btn" id="panelToggle" data-i18n-aria="panelToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>
        </button>
      </header>
      <div class="filters">
        <label class="mag-filter">
          <span><span data-i18n="minMag">Minimum magnitude</span> <output id="minMagOut">All</output></span>
          <input type="range" id="minMag" min="0" max="7" step="0.5" value="0">
        </label>
        <div class="filter-row">
          <label class="check"><input type="checkbox" id="inView"> <span data-i18n="inView">Only in map view</span></label>
          <div class="seg small" id="sortSeg" role="group" data-i18n-aria="sort">
            <button data-v="time" data-i18n="sort.time">Latest</button>
            <button data-v="mag" data-i18n="sort.mag">Strongest</button>
          </div>
        </div>
      </div>
      <div id="list" class="list"></div>
      <div id="detail" class="detail"></div>
      <div id="about" class="detail">
        <div class="d-head"><button class="icon-btn" data-act="back" data-i18n-aria="back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button><span data-i18n="about.title">About the data</span></div>
        <h3>EMSC + OVSICORI</h3>
        <p data-i18n-html="about.emsc"></p>
        <h3>USGS</h3>
        <p data-i18n-html="about.usgs"></p>
        <h3 data-i18n="about.plates.h">Plate boundaries</h3>
        <p data-i18n-html="about.plates"></p>
        <p class="note" data-i18n-html="about.note"></p>
      </div>
    </section>
  </div>

  <nav id="rail" class="glass" data-i18n-aria="layers">
    <button data-layer="quakes" data-i18n-title="layer.quakes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="2.5" fill="currentColor"/><circle cx="12" cy="12" r="6" opacity=".7"/><circle cx="12" cy="12" r="9.5" opacity=".35"/></svg>
      <span data-i18n="layer.quakes">Earthquakes</span>
    </button>
    <button data-layer="heat" data-i18n-title="layer.heat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3c3.5 3.2 6.5 6.4 6.5 10.2a6.5 6.5 0 0 1-13 0C5.5 9.4 8.5 6.2 12 3z"/><path d="M12 17a3 3 0 0 1-3-3" stroke-linecap="round"/></svg>
      <span data-i18n="layer.heat">Density</span>
    </button>
    <button data-layer="plates" data-i18n-title="layer.plates">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 14l4-3 3 4 4-7 3 5 3-3 3 2"/></svg>
      <span data-i18n="layer.plates">Plate boundaries</span>
    </button>
    <button data-layer="volcanoes" data-i18n-title="layer.volcanoes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l5.5-9h7L21 20z"/><path d="M10 7c0-1.5 1.5-1.5 1.5-3M14 7c0-1.5 1.5-1.5 1.5-3"/></svg>
      <span data-i18n="layer.volcanoes">Volcanoes (CR)</span>
    </button>
    <button data-layer="labels" data-i18n-title="layer.labels">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 18L9 6l5 12M5.8 14h6.4M16 10.5c.6-.6 1.4-1 2.3-1 1.5 0 2.2.8 2.2 2.2V18M20.5 14.5c-3 0-4.8.6-4.8 2 0 1 .7 1.6 1.8 1.6 1.6 0 3-1.2 3-3"/></svg>
      <span data-i18n="layer.labels">Labels</span>
    </button>
    <hr>
    <div class="rail-title" data-i18n="colorBy">Color by</div>
    <button data-color="depth" data-i18n-title="color.depth">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18M6 10h12M9 15h6M12 15v6M9.5 18.5L12 21l2.5-2.5"/></svg>
      <span data-i18n="color.depth">Depth</span>
    </button>
    <button data-color="age" data-i18n-title="color.age">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span data-i18n="color.age">Age</span>
    </button>
    <hr>
    <button id="globeBtn" data-i18n-title="globe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.7 3.8 5.7 3.8 9s-1.2 6.3-3.8 9c-2.6-2.7-3.8-5.7-3.8-9S9.4 5.7 12 3z"/></svg>
      <span data-i18n="globe">Globe</span>
    </button>
  </nav>

  <footer id="timeline" class="glass">
    <button id="playBtn" class="play" data-i18n-aria="play">
      <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.8l-10-6.5A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/></svg>
    </button>
    <button id="speedBtn" class="pill" data-i18n-title="speed">1×</button>
    <div class="tl-wrap"><canvas id="tl" data-i18n-aria="timeline.aria"></canvas></div>
    <button id="liveBtn" class="pill" data-i18n="live.btn" data-i18n-title="live.title">Live</button>
    <div id="legend" class="legend"></div>
  </footer>

  <div id="loading" class="glass" hidden><span class="spinner"></span><span id="loadingText">Loading…</span></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/sources.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
